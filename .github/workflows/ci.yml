name: CI

# The shared job chain (Composer validate, synced files, no-emoji, aggregate-needs, Pint, Rector,
# PHPStan, mutate-ignore, mutate and Pest) is called from UAMS-Web/uams-ci-workflows at a release
# tag; its source is `.claude/skills/code-quality/templates/ci-reusable.yml` in
# UAMS-Web/uams-claude-skills. The jobs below the call are the ones the chain does not provide.
# When a job's command changes here, change the matching `composer` script (and the other way
# round). The shared setup lives in `.github/actions/setup/action.yml`.
#
# - The pinned reference: `uses:` names a tag, never a branch, so a change to the shared chain
#   reaches this repository only when the tag here moves. Dependabot does not move it.
# - Inputs: `linux-only: true` keeps every job on `ubuntu-latest`. Dropping it adds Windows and
#   macOS legs to the jobs the chain classifies for all three platforms (`mutate-ignore` and
#   `pest`); that is a separate decision from this file. `mutate-paths` is the path the `mutate`
#   job selects changed PHP files from.
# - What the `mutate` job mutates depends on the event. A pull request and a push to `main` mutate
#   only the PHP files under `mutate-paths` that the commit adds, changes or renames; a commit that
#   changes none passes with nothing mutated. The full pass over everything `composer mutate`
#   covers runs on a `schedule` or `workflow_dispatch` run; the weekly schedule is its own ticket.
# - The chain's checks report as `checks / <job name> (<operating system>)`.
#
# RUN_REMOTE_CI: budget kill-switch.
# GitHub Actions minutes bill at the organization level, one pool shared by every UAMS-Web
# repository, and only private repositories consume them. Every job below, and every job in
# the pull-request workflows beside this one, is gated on `if: vars.RUN_REMOTE_CI != 'false'`,
# the call to the chain included: with the variable set to `false` the jobs report `skipped` and
# consume no runner minutes; unset, or any other value, runs them as before. A skipped job
# reports `Success`, so a green required check while the switch is off means nothing ran, not
# that the code passed; `composer ci` is the gate then. `scripts/remote-ci-gate.test.mjs` fails
# when a job is added without it.
#
# REQUIRED CHECKS. The repository's `required_checks` property is `ci-aggregate` and `pr-body`,
# which the organization rulesets "main: required checks (ci-aggregate)" and "main: required
# checks (pr-body)" turn into three required contexts: `CI`, `Attribution footer` and
# `Closing keywords`. No job below is required by name, so renaming or adding one needs no
# ruleset change. Job names must stay unique across all workflows in this repository.
#
# THE AGGREGATE. The last job, `CI`, `needs:` the call and every plain job in this file, runs
# `if: always()`, and fails unless each of them reported `success` (a `skipped` or `cancelled`
# job fails it as well, because a job that did not run proved nothing). The called workflow ends
# in a `Chain result` job that needs every job in the chain, so the call is `success` only when
# every job in it succeeded. Add, rename or remove a job here and the `needs:` list of `CI`
# changes in the same change; the chain's `aggregate-needs` job fails, naming the job, when one
# is left out. `CI` is the only job without the RUN_REMOTE_CI gate: with the switch off it fails,
# because every job it needs was skipped, and that is the intended reading (nothing ran, so
# nothing passed). Keep the job named exactly `CI`, and do not rename the `checks` job without
# changing `needs:` below.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch; on `main` it runs the full mutation pass.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run (a push to
# the default branch, a manual run) gets a group of its own, keyed on the commit, so a later push
# never cancels it: GitHub keeps one running and one pending run per group and cancels the
# pending one when another is queued, whatever `cancel-in-progress` says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain.
  checks:
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.9.0
    with:
      linux-only: true
      mutate-paths: src

  # The chain checks the emoji sweep; it does not check the decision log.
  decision-log:
    name: Decision log order
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the two entries, when docs/DECISIONS.md is out of order.
      - run: node scripts/check-decision-log-order.mjs

  scripts:
    name: Guard-script tests (vitest)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `@statamic/cms` is a `file:` link into `vendor/statamic/cms`, so `npm ci` needs Composer's
      # install first.
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor that `.npmrc`'s
      # engine-strict enforces, so `npm ci` refuses to run without this pin.
      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci
      - run: npm run test:scripts

  built-assets:
    name: Built assets (resources/dist matches source)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci

      # The built files are committed, because a Composer install does not run npm. A fresh
      # build that differs from what is committed means the sources changed without a rebuild.
      - run: npm run build
      - name: Fail if the committed build is out of date
        run: |
          changes=$(git status --porcelain -- resources/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::resources/dist differs from a fresh build. Run npm run build and commit the result."
            exit 1
          fi

  parallel-safe:
    name: Parallel-safe tests (no shared state)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Dependency-free, so it needs PHP and nothing else.
      - run: composer test:parallel-safe

  # The add-on promises `statamic/cms` at its `composer.json` constraint and PHP ^8.4, and every
  # job above runs one combination. These legs run the dependency-sensitive checks (Larastan and
  # Pest) against the others:
  #   - lowest: the lowest `statamic/cms` the constraint allows, with the dependencies it needs
  #     pulled to their lowest, so an API newer than the declared floor fails here.
  #   - php85: the locked dependencies on PHP 8.5.
  # The lowest bound is derived from the constraint in `composer.json`, never written here, so
  # raising the floor (when code starts to need a newer `statamic/cms` API) moves this leg with it.
  # Check names carry no version number for the same reason: the ruleset's list stays stable.
  # Only the `statamic/cms` dependency closure is lowered; the dev tooling stays locked. The
  # update rewrites `composer.lock` in the runner only.
  # Two jobs rather than one matrix job: a job skipped by the RUN_REMOTE_CI gate is skipped before
  # a matrix expands, so it would report the literal name `Compatibility (${{ matrix.name }})` and
  # the two required checks below would never report. Each job's `name:` is a required check.
  compatibility-lowest:
    name: Compatibility (lowest statamic/cms)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: '8.4'

      - name: Lower statamic/cms and its dependencies to their lowest allowed versions
        run: composer update statamic/cms --prefer-lowest --with-all-dependencies --no-interaction --no-progress

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  compatibility-php85:
    name: Compatibility (PHP 8.5)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and every
  # plain job in the file; .claude/skills/code-quality/scripts/check-aggregate-needs.mjs checks it.
  ci:
    name: CI
    needs:
      - checks
      - decision-log
      - scripts
      - built-assets
      - parallel-safe
      - compatibility-lowest
      - compatibility-php85
    # Deliberately not the RUN_REMOTE_CI gate: a skipped aggregate would read as a pass.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
